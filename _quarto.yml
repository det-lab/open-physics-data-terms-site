project:
  type: website
  output-dir: _site
  pre-render: build_index.py
  resources:
    - contributions/*.pdf

website:
  title: "Open physics data terms"
  site-url: https://det-lab.github.io/open-physics-data-terms-site/
  navbar: false
  sidebar: false
  page-footer: false

format:
  html:
    theme: none
    css: style.css
    minimal: true
    toc: false
    anchor-sections: false
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
